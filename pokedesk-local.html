<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ed" />
  <meta name="description" content="Pokedesk — a Pokémon-inspired personal life dashboard." />
  <title>Pokedesk — Your life, one quest at a time</title>
  <link rel="preconnect" href="https://pokeapi.co" />
  <link rel="preconnect" href="https://raw.githubusercontent.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #292b33;
      --muted: #83818a;
      --paper: #fbfaf5;
      --paper-2: #f5f2e9;
      --line: #ebe7dc;
      --green: #2d8259;
      --green-dark: #216d49;
      --green-soft: #e4f3e7;
      --pink: #e77eae;
      --yellow: #f5e83f;
      --shadow: 0 24px 70px rgba(48, 31, 63, .13), 0 3px 12px rgba(48, 31, 63, .05);
      font-family: 'Nunito', ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-optical-sizing: auto;
      background: #eee8f4;
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(45, 130, 89, .38);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: .48;
      cursor: not-allowed !important;
    }

    .app-backdrop {
      min-height: 100vh;
      padding: 28px 22px 38px;
      background: radial-gradient(ellipse at 12% 17%, rgba(229, 120, 188, .55), transparent 36%),
        radial-gradient(ellipse at 91% 13%, rgba(105, 94, 231, .58), transparent 34%),
        radial-gradient(ellipse at 83% 100%, rgba(244, 215, 104, .33), transparent 31%),
        linear-gradient(135deg, #d5c6eb 0%, #f5b3ce 58%, #d4ccf1 100%);
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
      min-height: calc(100vh - 66px);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 19px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .app-header {
      min-height: 75px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .69);
    }

    .brand {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 212px;
      text-align: left;
      cursor: pointer;
      padding: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      box-shadow: none;
      transform: none;
    }

    .brand-pokeball {
      width: 32px;
      height: 32px;
      filter: drop-shadow(1px 2px 0 rgba(31, 35, 43, .22));
    }

    .cursor-pokeball {
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 29px;
      height: 29px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) rotate(-18deg) scale(.82);
      transition: opacity .18s ease, transform .12s ease;
      will-change: left, top;
    }

    .cursor-sparkle {
      position: fixed;
      z-index: 9998;
      pointer-events: none;
      left: 0;
      top: 0;
      width: 12px;
      height: 12px;
      color: var(--sparkle-color, #e7c94f);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.35) rotate(0deg);
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, .85));
      animation: sparkle-pop .72s ease-out forwards;
    }

    @keyframes sparkle-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.25) rotate(0deg);
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15) rotate(35deg);
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--drift-x, 8px)), calc(-50% + var(--drift-y, -18px))) scale(.2) rotate(100deg);
      }
    }

    .cursor-pokeball.visible {
      opacity: .94;
      transform: translate(-50%, -50%) rotate(0deg) scale(1);
    }

    .cursor-pokeball.clicking {
      transform: translate(-50%, -50%) rotate(28deg) scale(.78);
    }

    .gym-badges {
      grid-column: 1 / -1;
      padding: 18px;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .gym-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 14px 8px;
      border: 1px solid #ece8de;
      border-radius: 12px;
      background: #fffdf7;
      text-align: center;
    }

    .gym-badge .badge-emblem {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 3px solid #e7e1d2;
      background: #f6f2e8;
      font-size: 28px;
      filter: grayscale(1);
      opacity: .55;
    }

    .gym-badge.earned .badge-emblem {
      filter: none;
      opacity: 1;
      border-color: #e4c75b;
      box-shadow: 0 4px 0 #e8dfc6, 0 0 0 4px #fff8d8;
      background: linear-gradient(145deg, #fff8cf, #f7dfa0);
    }

    .gym-badge strong {
      font-size: 11px;
    }

    .gym-badge small {
      font-size: 9px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .cursor-pokeball {
        display: none;
      }

      .badge-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-pokeball {
        display: none;
      }
    }

    .brand-word {
      font-size: 15px;
      font-weight: 1000;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .brand-word small {
      display: block;
      margin-top: 4px;
      color: #99959a;
      font-size: 7px;
      letter-spacing: 1.45px;
      font-weight: 900;
    }

    .main-nav {
      display: flex;
      align-self: stretch;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #939098;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .nav-item:hover {
      color: var(--green);
      background: #f7f8f1;
    }

    .nav-item.nav-active {
      color: var(--green-dark);
      border-bottom-color: var(--green);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .header-level {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fff7c7;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #6f7076;
      cursor: pointer;
      transition: .18s ease;
    }

    .icon-button:hover {
      border-color: var(--line);
      background: white;
      color: var(--green);
    }

    .notification-button {
      position: relative;
    }

    .notification-button i {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      right: 7px;
      top: 6px;
      background: #8f78e7;
      border: 1px solid white;
    }

    .mobile-nav {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 59px;
      padding: 8px 28px;
      border-bottom: 1px solid var(--line);
      background: #f9f7f0;
    }

    .mode-tabs {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mode-tabs button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border: 1px solid transparent;
      background: #f0eee7;
      border-radius: 7px;
      font-size: 10px;
      letter-spacing: .8px;
      text-transform: uppercase;
      font-weight: 1000;
      color: #6e6d70;
      cursor: pointer;
    }

    .mode-tabs button:hover {
      background: #eae8dd;
    }

    .mode-tabs button.mode-active {
      color: #45464c;
      background: #e5e2d9;
      border-color: #e1ddd2;
    }

    .mode-tabs button.focus-tab {
      background: var(--green);
      color: white;
      padding-inline: 17px;
      box-shadow: 0 2px 0 #1e6644;
    }

    .mode-tabs button.focus-tab:hover {
      background: var(--green-dark);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .connection-status {
      color: #8d8b91;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
    }

    .connection-status>span,
    .saved-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #65ad78;
      display: inline-block;
    }

    .current-page-chip {
      display: none;
      color: #8b8790;
      font-size: 10px;
      font-weight: 800;
    }

    .app-content {
      padding: 27px 28px 26px;
    }

    .page-intro {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 23px;
    }

    .eyebrow {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.45px;
      font-weight: 500;
      text-transform: uppercase;
      color: #99949a;
      line-height: 1.5;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(25px, 2.6vw, 33px);
      line-height: 1.12;
      letter-spacing: -.85px;
      font-weight: 1000;
    }

    h2 {
      margin-bottom: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -.3px;
      font-weight: 1000;
    }

    h3 {
      margin-bottom: 0;
      font-weight: 1000;
      letter-spacing: -.4px;
    }

    .muted {
      color: var(--muted);
    }

    .page-intro p {
      margin: 7px 0 0;
      font-size: 12px;
    }

    .wave {
      display: inline-block;
      color: #e5ba2e;
      font-size: 24px;
      transform: rotate(14deg);
    }

    .date-picker {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 11px;
      white-space: nowrap;
    }

    .date-picker label {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 6px;
      color: #8b8991;
    }

    .date-picker input {
      max-width: 127px;
      border: 0;
      background: transparent;
      color: #5f5c63;
      font-size: 11px;
      font-weight: 900;
      outline: none;
      cursor: pointer;
    }

    .today-button {
      border: 0;
      border-radius: 8px;
      background: #e6f2e8;
      color: #2e7b53;
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 1000;
      cursor: pointer;
    }

    .today-button:hover {
      background: #d8eddc;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(250px, .78fr) minmax(0, 1.5fr);
      gap: 17px;
    }

    .world-card {
      overflow: hidden;
      border-radius: 13px;
      border: 1px solid #e6e4d8;
      background: #f5f4e9;
      box-shadow: 0 3px 9px rgba(35, 46, 25, .035);
    }

    .world-topline {
      height: 39px;
      padding: 9px 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 5px;
      padding: 4px 7px;
      color: #79747c;
      background: #f0ede4;
      font-family: 'DM Mono', monospace;
      letter-spacing: .5px;
      font-size: 9px;
      line-height: 1.2;
      font-weight: 500;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tag.green {
      background: #dfefe1;
      color: #347a50;
    }

    .tag.yellow {
      color: #61591b;
      background: #fff4a7;
    }

    .tag svg {
      flex: 0 0 auto;
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #53ad68;
      box-shadow: 0 0 0 3px rgba(83, 173, 104, .14);
    }

    .world-menu {
      border: 0;
      background: transparent;
      color: #8c8d76;
      padding: 2px;
      cursor: pointer;
    }

    .world-scene {
      height: 252px;
      position: relative;
      overflow: hidden;
      margin: 0 12px;
      border: 3px solid #e7e7c7;
      border-radius: 9px;
      background-color: #a4d96a;
      background-image: radial-gradient(ellipse at 50% 45%, rgba(202, 241, 130, .65) 0, transparent 60%), repeating-linear-gradient(0deg, transparent, transparent 13px, rgba(48, 142, 62, .11) 14px, rgba(48, 142, 62, .11) 15px), repeating-linear-gradient(90deg, transparent, transparent 13px, rgba(48, 142, 62, .10) 14px, rgba(48, 142, 62, .10) 15px);
      image-rendering: pixelated;
    }

    .world-scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 47%, rgba(57, 117, 44, .11) 100%);
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      height: 15px;
      width: 45px;
      background: rgba(255, 255, 239, .7);
      border-radius: 15px;
      opacity: .83;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before {
      width: 20px;
      height: 20px;
      left: 6px;
      top: -8px;
    }

    .cloud::after {
      width: 15px;
      height: 15px;
      right: 5px;
      top: -5px;
    }

    .cloud-one {
      left: 9%;
      top: 17%;
      transform: scale(.72);
    }

    .cloud-two {
      right: 12%;
      top: 24%;
      transform: scale(.55);
    }

    .shrine {
      position: absolute;
      width: 115px;
      height: 91px;
      left: 50%;
      top: 6%;
      transform: translateX(-50%);
      filter: drop-shadow(2px 3px 0 rgba(39, 68, 43, .2));
      z-index: 2;
    }

    .shrine-roof {
      position: absolute;
      left: 1px;
      width: 113px;
      height: 14px;
      background: #343c88;
      border: 3px solid #212a66;
      clip-path: polygon(9% 0, 91% 0, 100% 48%, 95% 100%, 5% 100%, 0 48%);
    }

    .roof-one {
      top: 0;
    }

    .roof-two {
      top: 13px;
      left: 8px;
      width: 99px;
      height: 10px;
      background: #545dc0;
    }

    .shrine-top {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 22px;
      height: 7px;
      background: #b7c9ed;
      border: 2px solid #343d82;
    }

    .shrine-columns {
      position: absolute;
      left: 15px;
      right: 15px;
      top: 29px;
      height: 38px;
      display: flex;
      justify-content: space-between;
      background: #fff7bf;
      border-inline: 4px solid #39428b;
    }

    .shrine-columns i {
      display: block;
      width: 8px;
      height: 38px;
      background: #4350a0;
      border-inline: 1px solid #222969;
    }

    .shrine-base {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 17px;
      height: 8px;
      background: #313c88;
      border: 2px solid #212969;
    }

    .flower,
    .grass {
      position: absolute;
      z-index: 1;
      font-size: 15px;
      line-height: 1;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, .6);
    }

    .flower {
      color: #f06878;
    }

    .flower-a {
      left: 12%;
      bottom: 27%;
    }

    .flower-b {
      left: 31%;
      bottom: 12%;
      color: #e4cb35;
    }

    .flower-c {
      right: 18%;
      bottom: 20%;
      color: #ed7465;
    }

    .flower-d {
      right: 25%;
      top: 45%;
      color: #ffd943;
    }

    .flower-e {
      left: 19%;
      top: 52%;
      color: #fae05b;
    }

    .grass {
      color: #4caa56;
      font-size: 12px;
    }

    .grass-a {
      left: 7%;
      top: 37%;
    }

    .grass-b {
      left: 26%;
      top: 68%;
    }

    .grass-c {
      right: 8%;
      top: 56%;
    }

    .grass-d {
      right: 40%;
      bottom: 8%;
    }

    .grass-e {
      right: 12%;
      bottom: 10%;
    }

    .world-pokemon {
      position: absolute;
      z-index: 3;
    }

    .world-pokemon .pokemon-sprite img {
      width: 47px;
      height: 47px;
      image-rendering: pixelated;
    }

    .pokemon-left {
      left: 22%;
      bottom: 24%;
    }

    .pokemon-right {
      right: 18%;
      bottom: 25%;
    }

    .world-partner {
      position: absolute;
      left: 50%;
      bottom: 16%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .world-partner .pokemon-sprite {
      width: 67px;
      height: 65px;
      background: rgba(255, 255, 255, .24);
      border-radius: 50%;
      animation: bob 3.4s ease-in-out infinite;
    }

    .world-partner img {
      width: 65px;
      height: 65px;
      filter: drop-shadow(0 3px 0 rgba(36, 92, 33, .2));
      image-rendering: pixelated;
    }

    .world-partner span {
      padding: 3px 7px;
      border: 1px solid rgba(76, 117, 45, .2);
      border-radius: 4px;
      background: rgba(251, 250, 229, .9);
      color: #427443;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .world-map-label {
      position: absolute;
      bottom: 5px;
      left: 7px;
      right: 7px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border: 1px solid rgba(60, 102, 41, .15);
      border-radius: 5px;
      background: rgba(246, 249, 217, .91);
      color: #59814d;
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: 1px;
    }

    .world-map-label>span:first-child {
      font-size: 12px;
    }

    .route-dot {
      margin-left: auto;
      width: 5px;
      height: 5px;
      background: #5da964;
      border-radius: 50%;
    }

    .world-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px 14px;
    }

    .world-footer>div {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .world-footer strong {
      font-size: 13px;
    }

    .small-text {
      font-size: 10px;
    }

    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 33px;
      padding: 7px 11px;
      border: 1px solid #e5e0d5;
      border-radius: 8px;
      background: #fffdf6;
      color: #777078;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      transition: .18s;
      white-space: nowrap;
    }

    .secondary-button:hover {
      border-color: #c7dfc9;
      color: var(--green);
      background: #f4faf1;
    }

    .hero-right {
      display: grid;
      grid-template-rows: minmax(138px, auto) minmax(145px, auto);
      gap: 14px;
    }

    .stats-card {
      background: #f3f1e8;
      border: 1px solid #ece9df;
      border-radius: 12px;
      padding: 16px 18px 12px;
    }

    .stats-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .stats-head>div {

      min-height: 151px;

      align-items: center;
      gap: 8px;

      border-radius: 12px;
      background: #f9f7ee;

      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 105px;
    }

      content: '';
      width: 108px;
      height: 108px;
      border-radius: 50%;
      position: absolute;
      background: #efe8d8;
    }

    .focus-illustration::after {
      content: '';
      position: absolute;
      bottom: 9px;
      width: 94px;
      height: 14px;
      border-radius: 50%;
      background: rgba(91, 83, 64, .09);

      z-index: 2;
      width: 100px;
      height: 100px;
    }

    .focus-pokemon img {
      filter: drop-shadow(0 5px 0 rgba(89, 78, 54, .11));
    }

    .focus-spark {
      position: absolute;
      z-index: 3;
      top: 10px;
      right: 12px;
      color: #d3b04c;
      font-size: 28px;

    .focus-copy p {

    .primary-button {

      font-size: 10px;
    }

    .done-button {
      background: #52875c;
    }

    .quick-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 17px;
    }

    .quick-stat {

      align-items: center;
      gap: 10px;

      border-radius: 10px;

      display: inline-grid;
      place-items: center;

      height: 36px;

    .mint {

      background: #e4f3e6;
    }

      background: #fbe8da;

    .quest-section {

    }

    .book-peach {

      width: 1px;
      padding: 8px;
      border: 1px solid #e8e3d8;
      border-radius: 7px;
      background: #fff;
      font-size: 10px;
    }

    .counter-control {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 7px;
      border: 1px solid #e8e3d8;
      border-radius: 8px;
      background: #fff;
    }

    .counter-control button {
      width: 26px;
      height: 25px;
      border: 0;
      border-radius: 6px;
      background: #f0f3e9;
      color: #458256;
      font-size: 18px;
      cursor: pointer;
    }

    .counter-control strong {
      min-width: 14px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    .counter-control .small-text {
      margin-left: auto;
    }

    .check-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      width: 100%;
      margin: 8px 0 2px;
      cursor: pointer;
    }

    .check-row input {
      accent-color: #448b5d;
      width: 15px;
      height: 15px;
      margin-top: 2px;
    }

    .check-row span {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .check-row strong {
      font-size: 10px;
    }

    .check-row small {
      color: #969099;
      font-size: 9px;
      line-height: 1.4;
    }

    .routine-disclaimer {
      margin-top: 17px;
    }

    /* Finance */
    .finance-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }

    .finance-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .finance-stat>strong {
      font-family: 'DM Mono', monospace;
      font-size: clamp(22px, 2.5vw, 29px);
      letter-spacing: -1.2px;
    }

    .finance-icon {
      width: 37px;
      height: 37px;
    }

    .inline-setting {
      margin-top: 0;
      font-size: 9px;
    }

    .inline-setting input {
      padding: 7px 9px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
    }

    .finance-track {
      width: 100%;
      margin-top: 2px;
      background: #f1ede4;
    }

    .finance-track>span {
      background: #d29a5d;
    }

    .finance-layout {
      display: grid;
      grid-template-columns: minmax(230px, .75fr) minmax(0, 1.5fr);
      gap: 14px;
      margin-top: 15px;
    }

    .transaction-form .section-heading {
      align-items: flex-start;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 9px;
      background: #f2f0e8;
    }

    .segmented-control button {
      padding: 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #86818a;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .segmented-control button.selected {
      background: #fffefa;
      color: #347c52;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
    }

    .full-button {
      width: 100%;
      margin-top: 15px;
    }

    .transactions-panel {
      display: flex;
      flex-direction: column;
    }

    .transaction-list {
      flex: 1;
      min-height: 150px;
    }

    .transaction-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f0ede5;
    }

    .transaction-icon {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 9px;
      background: #f9e9dd;
      color: #b97f52;
      flex: 0 0 auto;
    }

    .transaction-icon.income-icon {
      background: #e4f3e6;
      color: #3b8958;
    }

    .transaction-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .transaction-info strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .transaction-info span {
      color: #9e99a0;
      font-size: 9px;
    }

    .positive-amount,
    .negative-amount {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .positive-amount {
      color: #3b8c57;
    }

    .negative-amount {
      color: #af6b5b;
    }

    .delete-transaction {
      opacity: .55;
      width: 26px;
      height: 26px;
    }

    .delete-transaction:hover {
      opacity: 1;
      color: #bc514b;
    }

    .transaction-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid #ece8df;
      color: #827d85;
      font-size: 11px;
    }

    .transaction-summary strong {
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
    }

    /* Pokédex */
    .dex-summary {
      display: grid;
      grid-template-columns: 1fr 240px;
      align-items: center;
      overflow: hidden;
      min-height: 220px;
      padding: 22px 27px;
      background: linear-gradient(110deg, #f4f1e5 0%, #fbf9f0 58%, #f1e9d2 100%);
    }

    .dex-summary-copy h2 {
      margin-top: 13px;
      font-size: 25px;
    }

    .dex-summary-copy>p {
      max-width: 410px;
      margin: 8px 0 16px;
      font-size: 12px;
      line-height: 1.55;
    }

    .dex-summary-stats {
      display: flex;
      gap: 24px;
    }

    .dex-summary-stats div {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dex-summary-stats strong {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
    }

    .dex-summary-stats span {
      color: #9a949b;
      font-size: 9px;
    }

    .dex-feature-art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 180px;
    }

    .dex-feature-pokemon {
      z-index: 2;
      width: 170px;
      height: 170px;
    }

    .dex-feature-pokemon img {
      filter: drop-shadow(0 8px 0 rgba(76, 67, 41, .08));
    }

    .dex-orbit {
      position: absolute;
      border: 1px dashed rgba(124, 149, 91, .42);
      border-radius: 50%;
    }

    .orbit-one {
      width: 170px;
      height: 170px;
    }

    .orbit-two {
      width: 128px;
      height: 128px;
      border-color: rgba(124, 149, 91, .22);
    }

    .page-content>.section-heading {
      margin-top: 25px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
    }

    .collection-card {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 9px;
      padding: 12px;
      background: #fffefa;
    }

    .collection-number {
      align-self: stretch;
      color: #a7a0a7;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
    }

    .collection-art {
      width: 100px;
      height: 100px;
    }

    .collection-card>strong {
      font-size: 12px;
    }

    .collection-card .secondary-button {
      width: 100%;
    }

    /* Pokédex modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(38, 33, 45, .43);
      backdrop-filter: blur(7px);
      animation: fade-in .18s ease;
    }

    .focus-modal,
    .simple-modal,
    .pokedex-modal {
      position: relative;
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid #eee7d9;
      border-radius: 19px;
      background: #fffdf7;
      box-shadow: 0 25px 100px rgba(26, 22, 29, .25);
      animation: modal-up .24s ease;
    }

    .modal-close {
      position: absolute;
      top: 13px;
      right: 13px;
    }

    .focus-modal {
      text-align: center;
      overflow: hidden;
    }

    .focus-modal-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: 0 auto 13px;
      border-radius: 13px;
      background: #e5f2e7;
      color: #2f8052;
    }

    .focus-modal h2,
    .simple-modal h2 {
      margin-top: 5px;
      font-size: 25px;
    }

    .focus-modal>p.muted,
    .simple-modal>p.muted {
      margin: 7px 0 16px;
      font-size: 11px;
    }

    .timer-modes {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 4px;
      border-radius: 9px;
      background: #f1eee5;
    }

    .timer-modes button {
      flex: 1;
      border: 0;
      border-radius: 7px;
      padding: 8px 4px;
      color: #8c8790;
      background: transparent;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .timer-modes button.selected {
      background: white;
      color: #327d51;
      box-shadow: 0 1px 4px #e6e1d6;
    }

    .timer-ring {
      display: grid;
      place-items: center;
      width: 195px;
      height: 195px;
      margin: 21px auto 14px;
      border-radius: 50%;
      background: conic-gradient(#4a9b67 var(--timer-progress), #eee9dc var(--timer-progress));
      position: relative;
    }

    .timer-ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #fffdf7;
    }

    .timer-ring>div {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .timer-ring strong {
      font-family: 'DM Mono', monospace;
      font-size: 38px;
      letter-spacing: -2px;
    }

    .timer-ring span {
      color: #9a949b;
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: .9px;
    }

    .timer-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .timer-actions .primary-button {
      min-width: 155px;
    }

    .success-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 12px;
      color: #3c8b55;
      font-size: 10px;
      font-weight: 900;
    }

    .tiny-note {
      color: #9a949b;
      font-size: 9px;
      line-height: 1.6;
    }

    .focus-modal .tiny-note {
      margin: 15px 0 0;
    }

    .simple-modal {
      text-align: left;
    }

    .simple-modal .form-label {
      margin-top: 13px;
    }

    .simple-modal .full-button {
      margin-top: 19px;
    }

    .pokedex-backdrop {
      padding: 16px;
    }

    .pokedex-modal {
      width: min(100%, 900px);
      max-height: min(88vh, 850px);
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .dex-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .dex-modal-head h2 {
      margin-top: 3px;
      font-size: 25px;
    }

    .dex-modal-head h2 span {
      margin-left: 5px;
      color: #b3a99c;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    .dex-modal-head p {
      margin: 5px 0 0;
      font-size: 11px;
    }

    .dex-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 17px 0 12px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e7e1d6;
      border-radius: 9px;
      background: white;
      color: #9b949b;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 11px;
    }

    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
      overflow-y: auto;
      padding: 2px 3px 12px 1px;
    }

    .pokemon-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 8px 6px 9px;
      border: 1px solid #eee9df;
      border-radius: 10px;
      background: #fbfaf5;
    }

    .pokemon-card.is-caught {
      border-color: #cfe4ce;
      background: #f5fbf1;
    }

    .pokemon-card-number {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #aaa3a7;
      font-family: 'DM Mono', monospace;
      font-size: 8px;
    }

    .pokemon-card-number svg {
      color: #4e9a64;
    }

    .pokemon-card-art {
      width: 74px;
      height: 69px;
    }

    .pokemon-card-art img {
      filter: drop-shadow(0 4px 0 rgba(68, 57, 45, .06));
    }

    .pokemon-card>strong {
      overflow: hidden;
      max-width: 100%;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }

    .pokemon-card .tag {
      margin: 2px 0 0;
      font-size: 7px;
    }

    .mini-action {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      justify-content: center;
      min-height: 25px;
      max-width: 100%;
      padding: 5px 6px;
      border: 1px solid #e7e1d7;
      border-radius: 6px;
      background: white;
      color: #6f6a73;
      font-size: 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .mini-action:hover {
      border-color: #a4cfad;
      color: #327d50;
    }

    .mini-action.catch-action {
      border-color: #c9e3cb;
      color: #347b51;
      background: #eef8e9;
    }

    .dex-note {
      margin: 10px 0 0;
    }

    .loading-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 150px;
      color: #938d94;
      font-size: 11px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #e7e1d8;
      border-top-color: #4b9362;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .empty-state {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 9px;
      padding: 26px;
      text-align: center;
      color: #a39ca3;
    }

    .empty-state>svg {
      color: #a5caa2;
    }

    .empty-state strong {
      color: #6f6a72;
      font-size: 12px;
    }

    .empty-state span {
      max-width: 260px;
      font-size: 10px;
      line-height: 1.5;
    }

    .empty-state .primary-button {
      margin-top: 4px;
    }

    /* Settings */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .settings-card {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
    }

    .settings-card h2 {
      font-size: 16px;
    }

    .settings-card p {
      min-height: 70px;
      margin-bottom: 0;
      font-size: 11px;
      line-height: 1.65;
    }

    .danger-outline {
      border-color: #ecd3ce;
      color: #ad6558;
    }

    .danger-outline:hover {
      border-color: #d8a59a;
      color: #a64b42;
      background: #fff5f1;
    }

    .danger-button {
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid #bc5d53;
      border-radius: 8px;
      background: #be6256;
      color: white;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .confirm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes modal-up {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 1000px) {
      .app-backdrop {
        padding: 18px 12px 25px;
      }

      .app-header {
        gap: 12px;
        padding: 0 18px;
      }

      .brand {
        flex-basis: 168px;
      }

      .main-nav {
        gap: 1px;
      }

      .nav-item {
        padding-inline: 8px;
        gap: 5px;
        font-size: 10px;
      }

      .toolbar {
        padding-inline: 18px;
      }

      .app-content {
        padding: 22px 18px;
      }

      .world-scene {
        height: 230px;
      }

      .quest-books {
        gap: 10px;
      }

      .quest-book {
        padding-inline: 8px;
      }

      .book-hint {
        font-size: 7px;
      }

      .book-emoji {
        font-size: 20px;
      }

      .focus-card {
        padding-inline: 12px;
      }

      .focus-copy h3 {
        font-size: 18px;
      }
    }

    @media (max-width: 760px) {
      .app-backdrop {
        padding: 0;
        background: #f1d1e3;
      }

      .app-shell {
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .app-header {
        min-height: 64px;
        padding: 0 15px;
        gap: 8px;
      }

      .brand {
        flex: 1;
      }

      .main-nav {
        display: none;
      }

      .header-actions {
        gap: 4px;
      }

      .header-level {
        padding: 6px 8px;
      }

      .mobile-nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 8px 6px 7px;
        border-bottom: 1px solid var(--line);
        background: #fffdf8;
      }

      .mobile-nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
        padding: 6px 0;
        border: 0;
        background: transparent;
        color: #9a949d;
        font-size: 9px;
        font-weight: 900;
        cursor: pointer;
      }

      .mobile-nav button.active {
        color: #347b51;
      }

      .toolbar {
        min-height: 52px;
        padding: 7px 12px;
      }

      .mode-tabs {
        gap: 5px;
      }

      .mode-tabs button {
        padding: 9px;
        font-size: 9px;
        letter-spacing: .3px;
      }

      .mode-tabs button.focus-tab {
        padding-inline: 10px;
      }

      .toolbar-right {
        gap: 0;
      }

      .current-page-chip {
        display: none;
      }

      .connection-status {
        font-size: 9px;
      }

      .app-content {
        padding: 20px 13px 24px;
      }

      .page-intro {
        align-items: flex-start;
        flex-direction: column;
        gap: 13px;
      }

      .date-picker {
        align-self: flex-start;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .world-card {
        display: grid;
        grid-template-rows: auto minmax(210px, 260px) auto;
      }

      .world-scene {
        height: 248px;
      }

      .hero-right {
        grid-template-rows: auto auto;
      }

      .focus-card {
        grid-template-columns: .78fr 1.22fr;
        min-height: 155px;
      }

      .quick-stats-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .quick-stat {
        padding: 10px;
      }

      .quick-stat .micro-progress {
        max-width: 160px;
      }

      .quest-books {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px 11px;
      }

      .quest-book {
        min-height: 118px;
        padding: 25px 10px 10px;
      }

      .book-hint {
        font-size: 8px;
      }

      .bottom-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-footer {
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding-inline: 12px;
        text-align: center;
      }

      .journal-layout,
      .finance-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .journal-sidebar {
        padding: 18px;
      }

      .journal-stamp {
        margin-bottom: 12px;
      }

      .journal-prompt {
        padding-top: 15px;
      }

      .journal-editor {
        min-height: 430px;
        padding: 17px;
      }

      .routine-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .routine-card>p {
        min-height: unset;
      }

      .finance-stat-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .finance-stat {
        display: grid;
        grid-template-columns: 40px 1fr;
        align-items: center;
        column-gap: 10px;
      }

      .finance-stat .finance-icon {
        grid-row: span 2;
      }

      .finance-stat>strong {
        grid-column: 2;
      }

      .finance-stat .form-label,
      .finance-stat .tiny-note,

</head>

  <script>
    /* Pokedesk local-first standalone runtime. No bundler or dependency install required. */
    (() => {
      'use strict';
      const PREFIX = 'pokedesk:v1:';
      const today = () => new Date().toLocaleDateString('en-CA');
      const shiftDate = (value, amount) => { const d = new Date(`${value}T12:00:00`); d.setDate(d.getDate() + amount); return d.toLocaleDateString('en-CA'); };
      const dateLabel = (value, options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) => new Date(`${value}T12:00:00`).toLocaleDateString('en-IN', options);
      const money = (value) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Number(value || 0));
      const esc = (value = '') => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      const read = (key, fallback) => { try { const raw = localStorage.getItem(PREFIX + key); return raw === null ? fallback : JSON.parse(raw); } catch { return fallback; } };
      const save = (key, value) => { try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { console.warn('Pokedesk could not save data', e); } };
      const seedTasks = [
        { id: 'q1', title: 'Plan the day before opening socials', category: 'daily', xp: 10 },
        { id: 'q2', title: 'Drink water after waking up', category: 'daily', xp: 10 },
        { id: 'q3', title: 'Review this month’s main goal', category: 'weekly', xp: 15 },
        { id: 'q4', title: 'Move one important work task forward', category: 'work', xp: 15 },
        { id: 'q5', title: 'Log today’s workout or recovery', category: 'fitness', xp: 15 },
        { id: 'q6', title: 'Write a short daily journal entry', category: 'daily', xp: 10 },
      ];
      const books = [
        { id: 'all', title: 'All Quests', color: 'blue', icon: '📘', hint: 'Every mission in one place' },
        { id: 'weekly', title: 'Weekly Quests', color: 'rust', icon: '📙', hint: 'Build momentum' },
        { id: 'daily', title: 'Daily Routine', color: 'amber', icon: '📔', hint: 'Small wins count' },
        { id: 'work', title: 'Work Log', color: 'violet', icon: '📕', hint: 'Move your craft forward' },
        { id: 'fitness', title: 'Fitness', color: 'teal', icon: '📗', hint: 'Train, recover, repeat' },
        { id: 'life', title: 'Life Admin', color: 'peach', icon: '📒', hint: 'Bills and little chores' },
      ];
      const fallback = [25, 1, 4, 7, 133, 39, 52, 143, 6, 94, 150, 151, 54, 16, 58, 63, 104].map((id) => ({ id, name: ({ 25: 'pikachu', 1: 'bulbasaur', 4: 'charmander', 7: 'squirtle', 133: 'eevee', 39: 'jigglypuff', 52: 'meowth', 143: 'snorlax', 6: 'charizard', 94: 'gengar', 150: 'mewtwo', 151: 'mew', 54: 'psyduck', 16: 'pidgey', 58: 'growlithe', 63: 'abra', 104: 'cubone' })[id], label: ({ 25: 'pikachu', 1: 'bulbasaur', 4: 'charmander', 7: 'squirtle', 133: 'eevee', 39: 'jigglypuff', 52: 'meowth', 143: 'snorlax', 6: 'charizard', 94: 'gengar', 150: 'mewtwo', 151: 'mew', 54: 'psyduck', 16: 'pidgey', 58: 'growlithe', 63: 'abra', 104: 'cubone' })[id], image: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png` }));
      const cachedDex = read('pokemon-index-cache', null);
      const cacheIsFresh = Boolean(cachedDex?.savedAt && Date.now() - cachedDex.savedAt < 1000 * 60 * 60 * 24 && Array.isArray(cachedDex.items));
      const state = {
        page: 'home', date: read('selected-date', today()),
        tasks: read('tasks', seedTasks), completions: read('completions', {}), logs: read('daily-logs', {}),
        finance: read('finance', { income: '50000', budget: '12000', expenses: [] }),
        xp: read('xp', 0), coins: read('coins', 30), caught: read('caught-pokemon', [25]), partner: read('partner-pokemon', 25),
        activeBook: 'all', pokemon: cachedDex?.items || fallback, pokemonLoading: !cacheIsFresh, pokemonError: false,
      };
      let modal = null;
      let timerMode = 'focus'; let timerRemaining = 25 * 60; let timerRunning = false; let timerCompleted = false; let timerInterval = null;
      const durations = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
      const log = () => state.logs[state.date] || {};
      const saveAll = () => {
        save('selected-date', state.date); save('tasks', state.tasks); save('completions', state.completions); save('daily-logs', state.logs);
        save('finance', state.finance); save('xp', state.xp); save('coins', state.coins); save('caught-pokemon', state.caught); save('partner-pokemon', state.partner);
      };
      const updateLog = (patch) => { state.logs[state.date] = { ...log(), ...patch }; save('daily-logs', state.logs); };
      const pkmn = (id) => state.pokemon.find((p) => p.id === Number(id)) || fallback.find((p) => p.id === Number(id));
      const pretty = (name = '') => name.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      const sprite = (pokemon, artwork = false, extra = '') => pokemon ? `<span class="pokemon-sprite ${extra}"><img src="${artwork ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemon.id}.png` : pokemon.image}" alt="${esc(pretty(pokemon.name))}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('sprite-error')"></span>` : '<span class="pokemon-placeholder">?</span>';
      const tag = (text, kind = '') => `<span class="tag ${kind}">${text}</span>`;
      const heading = (eyebrow, title, action = '', dataAction = '') => `<div class="section-heading"><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2></div>${action ? `<button class="text-action" data-action="${dataAction}">${action} <span>→</span></button>` : ''}</div>`;
      const datePicker = (aria = 'Selected date', monthShift = false) => `<div class="date-picker"><button class="icon-button" data-action="prev-date" data-step="${monthShift ? -30 : -1}" aria-label="Previous ${monthShift ? 'month' : 'date'}">‹</button><label>▦ <input aria-label="${aria}" type="date" data-role="date" value="${esc(state.date)}"></label><button class="icon-button" data-action="next-date" data-step="${monthShift ? 30 : 1}" aria-label="Next ${monthShift ? 'month' : 'date'}">›</button>${monthShift ? '' : `<button class="today-button" data-action="today">Today</button>`}</div>`;

      const activeCompleted = () => state.completions[state.date] || [];
      const completedTotal = () => Object.values(state.completions).reduce((n, ids) => n + ids.length, 0);

      function renderHome() {
        const completed = activeCompleted(); const tasks = state.tasks; const progress = tasks.length ? Math.round(completed.length / tasks.length * 100) : 0;
        const partner = pkmn(state.partner) || pkmn(25); const spent = (state.finance.expenses || []).filter((e) => e.date === state.date && e.kind !== 'income').reduce((n, e) => n + Number(e.amount || 0), 0);
        const filtered = tasks.filter((task) => state.activeBook === 'all' || task.category === state.activeBook);
        return `${pageIntro('YOUR DAILY ADVENTURE', 'Hey, trainer', 'A little progress goes a long way. What’s your next move?', datePicker())}
    <section class="hero-grid">
