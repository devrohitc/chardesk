      <div class="hero-right"><article class="stats-card"><div class="stats-head"><div><span class="eyebrow">TRAINER SUMMARY</span><strong>${dateLabel(state.date, { weekday: 'long', month: 'long', day: 'numeric' })}</strong></div><span class="weather-sticker">☀</span></div><div class="stats-row"><div class="stat"><span>Focus time</span><strong>${Math.floor(read('focus-minutes', 0) / 60)}<small>h</small> ${read('focus-minutes', 0) % 60}<small>m</small></strong></div><div class="stat"><span>Quests done</span><strong>${completed.length}<small>/${tasks.length}</small></strong></div><div class="stat"><span>New cheers</span><strong>${Math.floor(state.xp / 50)}<small>✦</small></strong></div></div><div class="trainer-level">${sprite(partner, false, 'level-avatar')}<div class="level-content"><div class="level-heading"><strong>LV. ${Math.floor(state.xp / 100) + 1} TRAINER</strong><span>${state.xp} XP</span></div><div class="xp-track"><span style="width:${state.xp % 100}%"></span></div><span class="tiny-note">${100 - state.xp % 100} XP to the next level</span></div><span class="level-trophy">🏆</span></div></article>
      <article class="focus-card"><div class="focus-illustration"><span class="focus-spark">✧</span><div class="focus-pokemon">${sprite(partner, true)}</div></div><div class="focus-copy">${tag('✦ TRAINER MODE', 'yellow')}<h3>Make some<br>progress today.</h3><p>One focused session can change the whole day.</p><button class="primary-button" data-action="open-focus">Focus now →</button></div></article></div></section>
    <section class="quick-stats-grid"><button class="quick-stat" data-page="routines"><span class="quick-icon mint">♟</span><span><small>GYM CHECK-IN</small><strong>${log().gym ? 'Done for today' : 'Not checked in'}</strong></span><span class="mini-status ${log().gym ? 'done' : ''}">${log().gym ? '✓' : '+'}</span></button><button class="quick-stat" data-page="routines"><span class="quick-icon peach">♨</span><span><small>WATER INTAKE</small><strong>${Number(log().water || 0)} / 8 glasses</strong><span class="micro-progress"><i style="width:${Math.min(Number(log().water || 0) / 8 * 100, 100)}%"></i></span></span><span class="mini-status">+</span></button><button class="quick-stat" data-page="finance"><span class="quick-icon lavender">₹</span><span><small>SPENT TODAY</small><strong>${money(spent)}</strong></span><span class="mini-status">↘</span></button></section>
    <section class="quest-section">${heading('YOUR MISSION BOARD', 'Pick a quest book', 'Add a quest +', 'add-quest')}<div class="quest-books">${books.map((book) => { const count = book.id === 'all' ? tasks.length : tasks.filter(t => t.category === book.id).length; const done = book.id === 'all' ? completed.length : tasks.filter(t => t.category === book.id && completed.includes(t.id)).length; return `<button class="quest-book book-${book.color} ${state.activeBook === book.id ? 'active' : ''}" data-book="${book.id}"><span class="book-tabs"><i></i><i></i><i></i></span><span class="book-number">${String(done).padStart(2, '0')} / ${String(count).padStart(2, '0')}</span><span class="book-emoji">${book.icon}</span><strong>${book.title}</strong><span class="book-hint">${book.hint}</span><span class="book-edge"></span></button>`; }).join('')}</div></section>
    <section class="bottom-grid"><article class="panel quest-list-panel">${heading('MAKE IT COUNT', state.activeBook === 'all' ? 'Today’s quests' : books.find(b => b.id === state.activeBook)?.title || 'Today’s quests', 'Add quest', 'add-quest')}<div class="quest-progress-line"><div class="progress-track"><span style="width:${progress}%"></span></div><span>${progress}%</span></div><div class="task-list">${filtered.length ? filtered.map((task) => { const done = completed.includes(task.id); return `<div class="task-row ${done ? 'task-done' : ''}"><button class="task-check ${done ? 'checked' : ''}" data-task="${esc(task.id)}">${done ? '✓' : ''}</button><button class="task-title-button" data-task="${esc(task.id)}">${esc(task.title)}</button><span class="task-xp">+${task.xp} XP</span></div>`; }).join('') : '<div class="empty-state"><strong>A fresh page</strong><span>Add your first quest to this book.</span></div>'}</div><div class="quest-list-footer"><span>✓ ${completed.length} completed today</span><span>◈ ${state.coins} coins</span></div></article>
      <article class="panel journal-mini">${heading('A MOMENT FOR YOU', 'Daily journal', 'Open journal', 'page-journal')}<p class="journal-date">▦ ${dateLabel(state.date, { month: 'short', day: 'numeric', year: 'numeric' })}</p><textarea data-log="journal" maxlength="5000" placeholder="What happened today? What are you grateful for? Write it down…">${esc(log().journal || '')}</textarea><div class="journal-footer"><span>♧ Saved locally on this device</span><span>${(log().journal || '').length}/5000</span></div><button class="prompt-chip" data-action="journal-prompt">✧ Prompt me: one win from today →</button></article></section>
    <div class="gentle-reminder">♥ <span>Consistency over perfection. Rest days and missed quests are part of the journey too.</span><span class="reminder-spark">✧</span></div>`;
      }

      function renderJournal() {
        const prompts = ['What was the best part of today?', 'What did I learn about myself?', 'What is one thing I want to do differently tomorrow?'];
        return `${pageIntro('YOUR PRIVATE CHRONICLE', 'Dear diary', 'Capture the little moments. Your future self will thank you.', datePicker('Journal date'))}<div class="journal-layout"><aside class="panel journal-sidebar"><div class="journal-stamp">✿</div><span class="eyebrow">YOUR STORY, YOUR SPACE</span><h2>${dateLabel(state.date, { weekday: 'long', month: 'long', day: 'numeric' })}</h2><p class="muted">No pressure to make it perfect. Just make it yours.</p><div class="privacy-note"><span>♧</span><div><strong>Private by default</strong><span>Your entry is saved in this browser on this device.</span></div></div><div class="journal-prompt"><span class="eyebrow">A LITTLE INSPIRATION</span><p>“${prompts[Math.abs(new Date(state.date + 'T12:00:00').getDate()) % prompts.length]}”</p><button class="text-action" data-action="journal-prompt">Use this prompt →</button></div></aside><section class="panel journal-editor"><div class="editor-toolbar">${tag('DAILY ENTRY', 'green')}<span><span class="saved-dot"></span> Auto-saved</span></div><input class="journal-title-input" data-log="journalTitle" value="${esc(log().journalTitle || '')}" placeholder="Give today a title (optional)"><textarea class="journal-main-textarea" data-log="journal" maxlength="20000" placeholder="Start writing…&#10;&#10;What did you do today? What felt good? What was difficult? What do you want to remember?">${esc(log().journal || '')}</textarea><div class="editor-footer"><span>▤ ${(log().journal || '').trim() ? (log().journal || '').trim().split(/\s+/).length : 0} words</span><span>${(log().journal || '').length}/20,000 characters</span></div></section></div>`;
      }

      function renderRoutines() {
        const l = log(); const meals = l.meals || {};
        return `${pageIntro('CARE FOR YOUR PLAYER ONE', 'Daily routines', 'Train, fuel up and recover. Your health is the main quest.', datePicker())}<div class="routine-grid"><section class="panel routine-card"><div class="routine-icon mint">🏋️</div><span class="eyebrow">FITNESS</span><h2>Gym check-in</h2><p class="muted">Show up for your body, even if it’s a lighter day.</p><button class="primary-button ${l.gym ? 'done-button' : ''}" data-action="toggle-gym">${l.gym ? '✓ Checked in' : '+ Check in today'}</button><label class="form-label">Workout notes<textarea data-log="workout" placeholder="Push day, 45 min walk, recovery…">${esc(l.workout || '')}</textarea></label></section>
    <section class="panel routine-card"><div class="routine-icon peach">♨</div><span class="eyebrow">NUTRITION</span><h2>Meals & fuel</h2><p class="muted">A simple record of what you eat. No judgment, just awareness.</p>${['Breakfast', 'Lunch', 'Dinner', 'Snacks'].map(meal => `<label class="meal-row"><span>${meal}</span><input data-meal="${meal}" value="${esc(meals[meal] || '')}" placeholder="What did you have?"></label>`).join('')}<label class="form-label water-label">Water glasses <div class="counter-control"><button data-action="water-minus">−</button><strong>${Number(l.water || 0)}</strong><button data-action="water-plus">+</button><span class="muted small-text">goal: 8</span></div></label></section>
    <section class="panel routine-card"><div class="routine-icon lavender">✧</div><span class="eyebrow">WELLNESS</span><h2>Daily care</h2><p class="muted">Small, repeatable rituals are powerful.</p><label class="form-label">Skincare / grooming notes<textarea data-log="grooming" placeholder="AM routine, sunscreen, haircare…">${esc(l.grooming || '')}</textarea></label><label class="check-row"><input type="checkbox" data-log-check="supplements" ${l.supplements ? 'checked' : ''}><span><strong>Supplement logged</strong><small>Record that you followed your usual plan.</small></span></label><label class="form-label">Sleep (hours)<input type="number" min="0" max="24" step="0.25" data-log="sleep" value="${esc(l.sleep || '')}" placeholder="e.g. 7.5"></label><label class="form-label">Mood today<select data-log="mood"><option value="">Choose a mood…</option>${['Great', 'Good', 'Okay', 'Low', 'Overwhelmed'].map(m => `<option ${l.mood === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label></section><section class="panel gym-badges"><span class="eyebrow">TRAINER MILESTONES</span><h2>Gym badge collection</h2><p class="muted">Earn badges by checking in on different days. Rest days are part of training, too.</p><div class="badge-grid">${[{ n: 'First Step', e: '🌱', d: 1 }, { n: 'Boulder Badge', e: '🪨', d: 3 }, { n: 'Cascade Badge', e: '💧', d: 7 }, { n: 'Thunder Badge', e: '⚡', d: 14 }, { n: 'Rainbow Badge', e: '🌈', d: 21 }, { n: 'Soul Badge', e: '💜', d: 30 }, { n: 'Marsh Badge', e: '🔮', d: 50 }, { n: 'Earth Badge', e: '🏆', d: 100 }].map(b => { const count = Object.values(state.logs).filter(x => x && x.gym).length; const earned = count >= b.d; return `<div class="gym-badge ${earned ? 'earned' : ''}"><span class="badge-emblem">${b.e}</span><strong>${b.n}</strong><small>${earned ? 'UNLOCKED' : `${count}/${b.d} gym days`}</small></div>` }).join('')}</div></section></div><p class="tiny-note routine-disclaimer">Personal tracking only. This prototype does not provide medical, dietetic or supplement advice.</p>`;
      }

      function renderFinance() {
        const month = state.date.slice(0, 7); const items = (state.finance.expenses || []).filter(e => e.date?.startsWith(month)); const bills = state.finance.bills || []; const billPayments = state.finance.billPayments || {}; const spent = items.filter(e => e.kind !== 'income').reduce((s, e) => s + Number(e.amount || 0), 0); const extra = items.filter(e => e.kind === 'income').reduce((s, e) => s + Number(e.amount || 0), 0); const budget = Number(state.finance.budget || 0); const income = Number(state.finance.income || 0) + extra;
        return `${pageIntro('YOUR COIN POUCH', 'Money map', 'Understand your spending without making finance feel complicated.', datePicker('Finance date', true))}<div class="finance-stat-grid"><article class="panel finance-stat"><span class="finance-icon mint">↘</span><span class="eyebrow">MONTHLY INCOME</span><strong>${money(income)}</strong><label class="form-label inline-setting">Salary / monthly income<input type="number" min="0" data-finance="income" value="${esc(state.finance.income)}"></label></article><article class="panel finance-stat"><span class="finance-icon peach">₹</span><span class="eyebrow">SPENDING THIS MONTH</span><strong>${money(spent)}</strong><div class="progress-track finance-track"><span style="width:${budget ? Math.min(100, spent / budget * 100) : 0}%"></span></div><span class="tiny-note">${budget ? Math.round(spent / budget * 100) + '% of your planned budget' : 'Set a budget to compare spending'}</span></article><article class="panel finance-stat"><span class="finance-icon lavender">◈</span><span class="eyebrow">PLANNED BUDGET</span><strong>${money(budget)}</strong><label class="form-label inline-setting">Monthly budget<input type="number" min="0" data-finance="budget" value="${esc(state.finance.budget)}"></label></article></div>
    <div class="finance-layout"><form class="panel transaction-form" id="transaction-form">${heading('QUICK CAPTURE', 'Add transaction')}<div class="segmented-control"><button type="button" data-kind="expense" class="${window.transactionKind !== 'income' ? 'selected' : ''}">Expense</button><button type="button" data-kind="income" class="${window.transactionKind === 'income' ? 'selected' : ''}">Income</button></div><label class="form-label">Description<input name="description" required placeholder="e.g. Groceries, salary, internet bill"></label><label class="form-label">Amount (₹)<input name="amount" min="1" step="0.01" type="number" required placeholder="0.00"></label><label class="form-label">Category<select name="category">${['Food', 'Transport', 'Bills', 'Shopping', 'Health', 'Gym', 'Entertainment', 'EMI / Debt', 'Savings', 'Salary', 'Other'].map(v => `<option>${v}</option>`).join('')}</select></label><button class="primary-button full-button" type="submit">+ Add transaction</button><p class="tiny-note">This local prototype does not connect to your bank.</p></form>
    <section class="panel transactions-panel">${heading(dateLabel(`${month}-15`, { month: 'long', year: 'numeric' }).toUpperCase(), 'Transaction history')}<div class="transaction-list">${items.length ? [...items].sort((a, b) => b.date.localeCompare(a.date)).map(item => `<div class="transaction-row"><span class="transaction-icon ${item.kind === 'income' ? 'income-icon' : ''}">${item.kind === 'income' ? '↙' : '₹'}</span><div class="transaction-info"><strong>${esc(item.description)}</strong><span>${esc(item.category)} · ${dateLabel(item.date, { month: 'short', day: 'numeric' })}</span></div><strong class="${item.kind === 'income' ? 'positive-amount' : 'negative-amount'}">${item.kind === 'income' ? '+' : '−'}${money(item.amount)}</strong><button class="icon-button delete-transaction" data-delete-transaction="${esc(item.id)}" aria-label="Delete transaction">×</button></div>`).join('') : '<div class="empty-state"><span>₹</span><strong>No transactions yet</strong><span>Add your first expense or income to start the monthly picture.</span></div>'}</div><div class="transaction-summary"><span>Net tracked this month</span><strong>${money(income - spent)}</strong></div></section></div>
    <section class="panel bills-panel">${heading('RECURRING PAYMENTS', 'Monthly bills')}<p class="muted bills-intro">Add a recurring bill once, then mark it paid for each month. Marking it paid does not create a second expense automatically.</p><form class="bill-form" id="bill-form"><label class="form-label">Bill name<input name="name" required maxlength="80" placeholder="Rent, mobile plan, EMI…"></label><label class="form-label">Amount (₹)<input name="amount" type="number" min="1" step="0.01" required placeholder="0.00"></label><label class="form-label">Due day<input name="dueDay" type="number" min="1" max="31" value="5" required></label><label class="form-label">Category<select name="category"><option>Bills</option><option>EMI / Debt</option><option>Utilities</option><option>Subscription</option><option>Rent</option><option>Other</option></select></label><button class="primary-button bill-add-button" type="submit">+ Add bill</button></form><div class="bill-list">${bills.length ? bills.map(bill => { const key = `${month}:${bill.id}`; const paid = Boolean(billPayments[key]); const overdue = !paid && Number(bill.dueDay) < Number(state.date.slice(8, 10)); return `<div class="bill-row"><span class="bill-status-icon ${paid ? 'paid' : overdue ? 'overdue' : ''}">${paid ? '✓' : '▦'}</span><div class="bill-info"><strong>${esc(bill.name)}</strong><span>${esc(bill.category)} · Due day ${bill.dueDay}</span></div><strong class="bill-amount">${money(bill.amount)}</strong>${tag(paid ? 'Paid' : overdue ? 'Past due' : 'Upcoming', paid ? 'green' : overdue ? 'yellow' : '')}<button class="secondary-button bill-toggle ${paid ? 'bill-unpaid' : ''}" data-bill-toggle="${esc(bill.id)}">${paid ? 'Mark unpaid' : 'Mark paid'}</button><button class="icon-button" data-bill-delete="${esc(bill.id)}" aria-label="Delete bill">×</button></div>` }).join('') : '<div class="empty-state"><span>▦</span><strong>No monthly bills yet</strong><span>Add rent, subscriptions, EMIs or utility bills to keep due dates visible.</span></div>'}</div></section><p class="tiny-note routine-disclaimer">Budget values, bills and transactions are saved in this browser only. This is not financial advice.</p>`;
      }

      function renderPokedex() {
        const caught = state.pokemon.filter(p => state.caught.includes(p.id)); const partner = pkmn(state.partner) || pkmn(25);
        return `${pageIntro('COLLECT AS YOU GROW', 'Your Pokédex', 'Every completed quest earns you closer to new companions.', `<button class="primary-button" data-action="open-dex">⌕ Browse Kanto</button>`)}<div class="dex-summary panel"><div class="dex-summary-copy">${tag('🎮 KANTO COLLECTION', 'yellow')}<h2>Small wins. New friends.</h2><p class="muted">Catch a Pokémon with coins earned from completing quests. Choose a partner to see them around your world.</p><div class="dex-summary-stats"><div><strong>${state.caught.length}</strong><span>Collected</span></div><div><strong>${state.pokemon.length || '—'}</strong><span>In Pokédex</span></div><div><strong>${state.coins}</strong><span>Coins</span></div></div></div><div class="dex-feature-art"><div class="dex-orbit orbit-one"></div><div class="dex-orbit orbit-two"></div>${sprite(partner, true, 'dex-feature-pokemon')}</div></div>${heading('YOUR COLLECTION', 'Your companions', 'Browse all 151', 'open-dex')}<div class="collection-grid">${caught.length ? caught.map(p => `<article class="panel collection-card"><div class="collection-number">No. ${String(p.id).padStart(3, '0')}</div>${sprite(p, true, 'collection-art')}<strong>${esc(pretty(p.name))}</strong>${p.id === state.partner ? tag('Current partner', 'green') : `<button class="secondary-button" data-partner="${p.id}">Choose partner</button>`}</article>`).join('') : '<div class="empty-state"><strong>Your adventure is just beginning</strong><span>Complete quests to earn coins, then catch your first companion.</span><button class="primary-button" data-action="open-dex">Explore Pokédex</button></div>'}</div>${state.pokemonLoading ? '<p class="tiny-note">Loading Pokémon data…</p>' : ''}${state.pokemonError ? '<p class="tiny-note">PokéAPI is unavailable right now. A starter list is shown instead.</p>' : ''}`;
      }

      function renderSettings() {
        return `${pageIntro('YOUR SPACE, YOUR RULES', 'Settings', 'Your first Pokedesk build is local-first and personal.')}<div class="settings-grid"><article class="panel settings-card"><div class="routine-icon lavender">♧</div><h2>Privacy & storage</h2><p class="muted">Your journal, routines, finances and goals are saved in this browser. They are not uploaded to a Pokedesk server.</p><button class="secondary-button" data-action="export">Export my data →</button></article><article class="panel settings-card"><div class="routine-icon peach">♟</div><h2>Theme & world</h2><p class="muted">This MVP focuses on one Pokémon-inspired light theme. Theme styles are separated from the data model for future expansion.</p>${tag('Adventure meadow · Active', 'green')}</article><article class="panel settings-card danger-card"><div class="routine-icon red">⚙</div><h2>Reset local data</h2><p class="muted">This permanently removes Pokedesk data saved in this browser. Export it first if you want a copy.</p><button class="secondary-button danger-outline" data-action="confirm-reset">Reset local data</button></article></div><p class="tiny-note routine-disclaimer">Browser storage can be cleared or lost with the device. Export a backup regularly.</p>`;
      }

      const pages = { home: renderHome, journal: renderJournal, routines: renderRoutines, finance: renderFinance, pokedex: renderPokedex, settings: renderSettings };
      function render() {
        document.querySelectorAll('[data-page]').forEach((el) => { el.classList.toggle('nav-active', el.dataset.page === state.page); el.classList.toggle('active', el.dataset.page === state.page); });
        document.querySelectorAll('[data-current-page]').forEach(el => el.textContent = ({ home: 'Home', journal: 'Journal', routines: 'Routines', finance: 'Finance', pokedex: 'Pokédex', settings: 'Settings' })[state.page] || 'Home');
        document.getElementById('app-content').innerHTML = (pages[state.page] || renderHome)();
      }

      function openFocus() {
        modal = 'focus'; timerRemaining = timerRemaining || durations[timerMode]; timerCompleted = false; renderModal();
      }
      function renderModal() {
        const host = document.getElementById('modal-host'); if (!modal) { host.innerHTML = ''; return; }
        if (modal === 'focus') {
          const progress = (durations[timerMode] - timerRemaining) / durations[timerMode] * 100;
          host.innerHTML = `<div class="modal-backdrop" data-action="backdrop-close"><section class="focus-modal" role="dialog" aria-modal="true"><button class="icon-button modal-close" data-action="close-modal">×</button><div class="focus-modal-mark">◉</div><span class="eyebrow">TRAIN YOUR ATTENTION</span><h2>Focus, trainer.</h2><p class="muted">One quest. One window. No distractions.</p><div class="timer-modes">${[['focus', 'Focus'], ['short', 'Short break'], ['long', 'Long break']].map(([id, label]) => `<button class="${timerMode === id ? 'selected' : ''}" data-timer-mode="${id}">${label}</button>`).join('')}</div><div class="timer-ring" style="--timer-progress:${progress}%"><div><strong id="timer-clock">${String(Math.floor(timerRemaining / 60)).padStart(2, '0')}:${String(timerRemaining % 60).padStart(2, '0')}</strong><span id="timer-status">${timerCompleted ? 'SESSION COMPLETE' : timerRunning ? 'IN FOCUS' : 'READY WHEN YOU ARE'}</span></div></div>${timerCompleted ? '<p class="success-note">✧ Nice work! One focus session added.</p>' : ''}<div class="timer-actions"><button class="primary-button" data-action="timer-start">${timerRunning ? 'Pause session' : timerRemaining === 0 ? 'Start again' : 'Start focus'} →</button><button class="secondary-button" data-action="timer-reset">Reset</button></div><p class="tiny-note">Keep Pokedesk open while the timer runs. No browser notifications required.</p></section></div>`;
        } else if (modal === 'add-quest') {
          host.innerHTML = `<div class="modal-backdrop" data-action="backdrop-close"><form id="add-quest-form" class="simple-modal"><button type="button" class="icon-button modal-close" data-action="close-modal">×</button><span class="eyebrow">NEW MISSION</span><h2>Add a quest</h2><p class="muted">Turn one small intention into your next win.</p><label class="form-label">Quest name<input name="title" required maxlength="100" autofocus placeholder="e.g. Read for 20 minutes"></label><label class="form-label">Quest book<select name="category">${books.filter(b => b.id !== 'all').map(b => `<option value="${b.id}" ${state.activeBook === b.id ? 'selected' : ''}>${b.title}</option>`).join('')}</select></label><button class="primary-button full-button" type="submit">Create quest +</button></form></div>`;
        } else if (modal === 'dex') {
          host.innerHTML = `<div class="modal-backdrop pokedex-backdrop" data-action="backdrop-close"><section class="pokedex-modal" role="dialog" aria-modal="true"><div class="dex-modal-head"><div><span class="eyebrow">KANTO FIELD GUIDE</span><h2>Pokédex <span>${state.pokemon.length}</span></h2><p class="muted">Collect companions by showing up for yourself.</p></div><button class="icon-button" data-action="close-modal">×</button></div><div class="dex-toolbar"><div class="search-box">⌕ <input id="dex-search" placeholder="Search Pokémon or dex number..."></div>${tag(`◈ ${state.coins} coins`, 'yellow')}</div><div class="pokemon-grid" id="dex-grid">${dexItems(state.pokemon, '')}</div><p class="tiny-note dex-note">The index is cached locally for 24 hours. Catching uses in-app coins earned from completed quests.</p></section></div>`;
        } else if (modal === 'reset') {
          host.innerHTML = `<div class="modal-backdrop"><section class="simple-modal"><span class="eyebrow">ARE YOU SURE?</span><h2>Reset this save?</h2><p class="muted">This deletes your Pokedesk data from this browser. Export first if needed.</p><div class="confirm-actions"><button class="danger-button" data-action="reset-now">Yes, reset everything</button><button class="secondary-button" data-action="close-modal">Cancel</button></div></section></div>`;
        }
      }
      function dexItems(items, search) {
        return items.filter(p => p.label.toLowerCase().includes(search.toLowerCase()) || String(p.id).includes(search)).map((p) => {
          const caught = state.caught.includes(p.id), partner = state.partner === p.id;
          const action = partner ? '<span class="tag green">Your partner</span>' : caught ? `<button class="mini-action" data-partner="${p.id}">Choose partner</button>` : `<button class="mini-action catch-action" data-catch="${p.id}" ${state.coins < 20 ? 'disabled' : ''}>+ Catch · 20</button>`;
          return `<article class="pokemon-card ${caught ? 'is-caught' : ''}"><div class="pokemon-card-number">#${String(p.id).padStart(3, '0')}${caught ? ' ✓' : ''}</div>${sprite(p, true, 'pokemon-card-art')}<strong>${esc(pretty(p.name))}</strong>${action}</article>`;
        }).join('') || '<div class="empty-state"><strong>No Pokémon found</strong><span>Try another name or number.</span></div>';
      }

      function toggleTask(id) {
        const task = state.tasks.find(t => t.id === id); if (!task) return;
        const done = activeCompleted(); const isDone = done.includes(id);
        state.completions[state.date] = isDone ? done.filter(v => v !== id) : [...done, id];
        state.xp = Math.max(0, state.xp + (isDone ? -task.xp : task.xp)); state.coins = Math.max(0, state.coins + (isDone ? -5 : 5)); saveAll(); render();
      }
      function addQuest(title, category) { state.tasks.unshift({ id: `q-${Date.now()}-${Math.random().toString(16).slice(2, 6)}`, title, category, xp: 10 }); state.activeBook = category; saveAll(); modal = null; renderModal(); render(); }
      function catchPokemon(id) { if (state.caught.includes(id) || state.coins < 20) return; state.coins -= 20; state.caught.push(id); saveAll(); render(); if (modal === 'dex') renderModal(); }
      function setPartner(id) { if (state.caught.includes(id)) { state.partner = id; saveAll(); render(); if (modal === 'dex') renderModal(); } }
      function updateDate(delta) { state.date = shiftDate(state.date, delta); saveAll(); render(); }
      function exportData() { const backup = { exportedAt: new Date().toISOString(), version: 1, ...state }; const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `pokedesk-backup-${state.date}.json`; a.click(); URL.revokeObjectURL(url); }
      function resetData() { Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k)); location.reload(); }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('button,[data-action],[data-page],[data-book],[data-task],[data-partner],[data-catch],[data-kind],[data-timer-mode],[data-bill-toggle],[data-bill-delete]'); if (!target) return;
        if (target.dataset.page) { state.page = target.dataset.page; modal = null; renderModal(); render(); return; }
        if (target.dataset.action === 'prev-date') { updateDate(Number(target.dataset.step || -1)); return; } if (target.dataset.action === 'next-date') { updateDate(Number(target.dataset.step || 1)); return; } if (target.dataset.action === 'today') { state.date = today(); saveAll(); render(); return; }
        if (target.dataset.book) { state.activeBook = target.dataset.book; render(); return; } if (target.dataset.task) { toggleTask(target.dataset.task); return; }
        if (target.dataset.action === 'add-quest') { modal = 'add-quest'; renderModal(); return; } if (target.dataset.action === 'page-journal') { state.page = 'journal'; render(); return; }
        if (target.dataset.action === 'open-focus') { openFocus(); return; } if (target.dataset.action === 'open-dex') { modal = 'dex'; renderModal(); return; } if (target.dataset.action === 'close-modal') { modal = null; clearInterval(timerInterval); timerRunning = false; renderModal(); return; }
        if (target.dataset.action === 'backdrop-close' && event.target === target) { modal = null; renderModal(); return; }
        if (target.dataset.action === 'journal-prompt') { const current = log().journal || ''; updateLog({ journal: `${current}${current ? '\n\n' : ''}One win from today: ` }); render(); const area = document.querySelector('[data-log="journal"]'); if (area) { area.focus(); area.setSelectionRange(area.value.length, area.value.length); } return; }
        if (target.dataset.action === 'toggle-gym') { updateLog({ gym: !log().gym }); render(); return; } if (target.dataset.action === 'water-plus') { updateLog({ water: Math.min(30, Number(log().water || 0) + 1) }); render(); return; } if (target.dataset.action === 'water-minus') { updateLog({ water: Math.max(0, Number(log().water || 0) - 1) }); render(); return; }
        if (target.dataset.action === 'export') { exportData(); return; } if (target.dataset.action === 'confirm-reset') { modal = 'reset'; renderModal(); return; } if (target.dataset.action === 'reset-now') { resetData(); return; }
        if (target.dataset.kind) { window.transactionKind = target.dataset.kind; render(); return; }
        if (target.dataset.partner) { setPartner(Number(target.dataset.partner)); return; } if (target.dataset.catch) { catchPokemon(Number(target.dataset.catch)); return; }
        if (target.dataset.billToggle) { const key = `${state.date.slice(0, 7)}:${target.dataset.billToggle}`; state.finance.billPayments = { ...(state.finance.billPayments || {}), [key]: !state.finance.billPayments?.[key] }; saveAll(); render(); return; }
        if (target.dataset.billDelete) { state.finance.bills = (state.finance.bills || []).filter(b => b.id !== target.dataset.billDelete); saveAll(); render(); return; }
        if (target.dataset.timerMode) { timerMode = target.dataset.timerMode; timerRemaining = durations[timerMode]; timerRunning = false; timerCompleted = false; clearInterval(timerInterval); renderModal(); return; }
        if (target.dataset.action === 'timer-start') { if (timerRunning) { timerRunning = false; clearInterval(timerInterval); renderModal(); } else { if (timerRemaining === 0) timerRemaining = durations[timerMode]; timerRunning = true; timerCompleted = false; renderModal(); timerInterval = window.setInterval(() => { timerRemaining = Math.max(0, timerRemaining - 1); const clock = document.getElementById('timer-clock'); const status = document.getElementById('timer-status'); const ring = document.querySelector('.timer-ring'); if (clock) clock.textContent = `${String(Math.floor(timerRemaining / 60)).padStart(2, '0')}:${String(timerRemaining % 60).padStart(2, '0')}`; if (ring) ring.style.setProperty('--timer-progress', `${(durations[timerMode] - timerRemaining) / durations[timerMode] * 100}%`); if (timerRemaining === 0) { timerRunning = false; timerCompleted = true; clearInterval(timerInterval); if (timerMode === 'focus') { state.xp += 15; state.coins += 5; save('focus-minutes', read('focus-minutes', 0) + 25); saveAll(); } if (status) status.textContent = 'SESSION COMPLETE'; const btn = document.querySelector('[data-action="timer-start"]'); if (btn) btn.textContent = 'Start again →'; const ringModal = document.querySelector('.focus-modal'); if (ringModal) { const notice = document.createElement('p'); notice.className = 'success-note'; notice.textContent = '✧ Nice work! Session complete.'; ringModal.querySelector('.timer-actions').before(notice); } } }, 1000); } return; }
        if (target.dataset.action === 'timer-reset') { timerRunning = false; clearInterval(timerInterval); timerRemaining = durations[timerMode]; timerCompleted = false; renderModal(); return; }
      });

      document.addEventListener('input', (event) => {
        const el = event.target;
        if (el.matches('[data-role="date"]')) { if (el.value) { state.date = el.value; saveAll(); render(); } return; }
        if (el.matches('[data-log]')) { updateLog({ [el.dataset.log]: el.value }); const count = document.querySelector('.editor-footer'); if (count && el.dataset.log === 'journal') { const text = el.value; count.innerHTML = `<span>▤ ${text.trim() ? text.trim().split(/\s+/).length : 0} words</span><span>${text.length}/20,000 characters</span>`; } return; }
        if (el.matches('[data-meal]')) { updateLog({ meals: { ...(log().meals || {}), [el.dataset.meal]: el.value } }); return; }
        if (el.matches('[data-finance]')) { state.finance[el.dataset.finance] = el.value; save('finance', state.finance); return; }
        if (el.id === 'dex-search') { const grid = document.getElementById('dex-grid'); if (grid) grid.innerHTML = dexItems(state.pokemon, el.value); return; }
      });
      document.addEventListener('change', (event) => { const el = event.target; if (el.matches('[data-log-check]')) updateLog({ [el.dataset.logCheck]: el.checked }); if (el.matches('[data-log="mood"]')) updateLog({ mood: el.value }); if (el.matches('[data-finance]')) { state.finance[el.dataset.finance] = el.value; save('finance', state.finance); render(); } saveAll(); });
      document.addEventListener('submit', (event) => {
        if (event.target.id === 'bill-form') { event.preventDefault(); const data = new FormData(event.target); const name = String(data.get('name') || '').trim(); const amount = Number(data.get('amount')); const dueDay = Math.min(31, Math.max(1, Number(data.get('dueDay')) || 1)); if (!name || !Number.isFinite(amount) || amount <= 0) return; state.finance.bills = [{ id: `bill-${Date.now()}`, name, amount, dueDay, category: String(data.get('category') || 'Bills') }, ...(state.finance.bills || [])]; saveAll(); render(); return; }
        if (event.target.id === 'add-quest-form') { event.preventDefault(); const data = new FormData(event.target); const title = String(data.get('title') || '').trim(); const category = String(data.get('category') || 'daily'); if (title) addQuest(title, category); }
        if (event.target.id === 'transaction-form') { event.preventDefault(); const data = new FormData(event.target); const amount = Number(data.get('amount')); const description = String(data.get('description') || '').trim(); if (!description || !Number.isFinite(amount) || amount <= 0) return; state.finance.expenses.unshift({ id: `tx-${Date.now()}`, date: state.date, description, amount, category: String(data.get('category') || 'Other'), kind: window.transactionKind || 'expense' }); saveAll(); render(); }
      });
      document.addEventListener('click', (event) => { const del = event.target.closest('[data-delete-transaction]'); if (del) { state.finance.expenses = state.finance.expenses.filter(item => item.id !== del.dataset.deleteTransaction); saveAll(); render(); } });

      // Poké Ball cursor with a little breathing room and a soft Jigglypuff-like sparkle trail.
      // Decorative only; disabled for touch and reduced-motion users.
      const cursorBall = document.getElementById('cursor-pokeball');
      const sparkleLayer = document.getElementById('cursor-sparkle-layer');
      if (cursorBall && sparkleLayer && matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        let lastSparkleAt = 0;
        let lastSparkleX = 0;
        let lastSparkleY = 0;
        const sparkleColors = ['#f4d75e', '#f3a9d2', '#bca7ff', '#a8e5cb', '#ffffff'];
        const makeSparkle = (x, y, big = false) => {
          const sparkle = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          sparkle.setAttribute('viewBox', '0 0 24 24');
          sparkle.setAttribute('class', 'cursor-sparkle');
          sparkle.setAttribute('width', big ? '17' : '11');
          sparkle.setAttribute('height', big ? '17' : '11');
          sparkle.style.left = `${x}px`; sparkle.style.top = `${y}px`;
          sparkle.style.setProperty('--sparkle-color', sparkleColors[Math.floor(Math.random() * sparkleColors.length)]);
          sparkle.style.setProperty('--drift-x', `${Math.round(Math.random() * 28 - 14)}px`);
          sparkle.style.setProperty('--drift-y', `${Math.round(-12 - Math.random() * 23)}px`);
          sparkle.innerHTML = '<path d="M12 1.5 14.8 9.2 22.5 12 14.8 14.8 12 22.5 9.2 14.8 1.5 12 9.2 9.2Z" fill="var(--sparkle-color)" stroke="#fff" stroke-width=".7" stroke-linejoin="round"/>';
          sparkleLayer.appendChild(sparkle);
          sparkle.addEventListener('animationend', () => sparkle.remove(), { once: true });
        };
        document.addEventListener('mousemove', (event) => {
          // Offset the ball to the upper-right so it never sits directly on the pointer.
          const ballX = event.clientX + 24;
          const ballY = event.clientY - 22;
          cursorBall.style.left = `${ballX}px`; cursorBall.style.top = `${ballY}px`;
          cursorBall.classList.add('visible');
          const now = performance.now();
          const movedEnough = Math.hypot(event.clientX - lastSparkleX, event.clientY - lastSparkleY) > 10;
          if (movedEnough && now - lastSparkleAt > 42) {
            makeSparkle(event.clientX + (Math.random() * 14 - 7), event.clientY + (Math.random() * 14 - 7), Math.random() > .72);
            lastSparkleAt = now; lastSparkleX = event.clientX; lastSparkleY = event.clientY;
          }
        });
        document.addEventListener('mouseleave', () => cursorBall.classList.remove('visible'));
        document.addEventListener('mousedown', () => { cursorBall.classList.add('clicking'); makeSparkle(parseFloat(cursorBall.style.left) || 0, parseFloat(cursorBall.style.top) || 0, true); });
        document.addEventListener('mouseup', () => cursorBall.classList.remove('clicking'));
      }
      render();
      if (cacheIsFresh) { state.pokemonLoading = false; } else fetch('https://pokeapi.co/api/v2/pokemon?limit=151&offset=0', { headers: { Accept: 'application/json' } }).then(response => { if (!response.ok) throw new Error(`PokéAPI returned ${response.status}`); return response.json(); }).then(data => {
        const items = data.results.map(p => { const id = Number(p.url.match(/\/pokemon\/(\d+)\/?$/)?.[1]); return { id, name: p.name, label: p.name.replace(/-/g, ' '), image: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png` }; }).filter(p => Number.isFinite(p.id));
        state.pokemon = items; state.pokemonLoading = false; state.pokemonError = false; save('pokemon-index-cache', { savedAt: Date.now(), items }); render(); if (modal === 'dex') renderModal();
      }).catch(() => { state.pokemonLoading = false; state.pokemonError = true; state.pokemon = state.pokemon.length ? state.pokemon : fallback; render(); if (modal === 'dex') renderModal(); });
    })();

  </script>
</body>

</html>
